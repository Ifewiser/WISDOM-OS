kind = "web"
previewPath = "/"
title = "Wisdom OS"
description = "A personal planning app for capturing thoughts, organizing projects and tasks, planning the day, and staying focused."
version = "1.0.0"
id = "artifacts/wisdom-os"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20406

[services.development]
run = "pnpm --filter @workspace/wisdom-os run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/wisdom-os", "run", "build" ]
serve = "static"
publicDir = "artifacts/wisdom-os/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20406"
BASE_PATH = "/"
